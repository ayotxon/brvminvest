name: Mise à jour quotidienne BRVM Conseil

on:
  schedule:
    # 17h00 UTC, du lundi au vendredi (~2h après la clôture BRVM à 15h GMT)
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les cours et reconstruire le dashboard
        run: python3 update_daily.py

      - name: Publier les changements
        run: |
          git config user.name "brvm-conseil-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html history.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier (marché fermé ou déjà à jour)."
          else
            git commit -m "Mise à jour quotidienne BRVM $(date -u +%Y-%m-%d)"
            git push
          fi
