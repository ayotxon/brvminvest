name: Mise à jour quotidienne BRVM Conseil

on:
  schedule:
    - cron: "*/20 9-15 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: brvm-daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer les cours et reconstruire le dashboard
        run: python3 update_daily.py

      - name: Publier les changements
        run: |
          git config user.name "brvm-conseil-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html history.json intraday.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier (marché fermé ou déjà à jour)."
            exit 0
          fi
          git commit -m "Mise à jour quotidienne BRVM $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Publié."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Tentative $i échouée, nouvel essai dans 5s..."
            sleep 5
          done
          echo "Échec de la publication après plusieurs tentatives." >&2
          exit 1